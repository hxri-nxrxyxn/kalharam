version: '3.8'

services:
  backend:
    build: 
      context: .
    command: node backend/server.js
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CORS_ORIGINS=https://kalharam.com,http://kalharam.com,http://203.57.85.59:5173,http://203.57.85.59:5174,http://localhost:5173,http://localhost:5174
      - JWT_SECRET=super-secret-docker-key
    volumes:
      - uploads_data:/app/web/static/assets/uploads
      - db_data:/app/backend/kalharam.db
    restart: always

  web:
    build: 
      context: .
    command: node web/build/index.js
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
    volumes:
      - uploads_data:/app/web/static/assets/uploads
    depends_on:
      - backend
    restart: always

  admin:
    build: 
      context: .
    # Uses 'serve' to host the static SPA of the admin console
    command: serve -s app/build -l 5174
    ports:
      - "5174:5174"
    depends_on:
      - backend
    restart: always

volumes:
  uploads_data:
  db_data:
